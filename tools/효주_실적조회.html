<style>
  :root{--navy:#1e3a5f;--navy-l:#eef3f9;--ink:#2b3440;--sub:#7a8694;--line:#e3e8ee;
        --ok:#0f7b4d;--ok-bg:#eefaf3;--warn:#b54708;--warn-bg:#fff6ec;--accent:#2e5c8a;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Malgun Gothic','맑은 고딕',-apple-system,sans-serif;color:var(--ink);line-height:1.5;background:#fff;}
  .wrap{max-width:960px;margin:0 auto;padding:26px 18px 60px;}
  header{border-bottom:3px solid var(--navy);padding-bottom:14px;margin-bottom:18px;}
  h1{font-size:22px;color:var(--navy);font-weight:800;}
  header p{font-size:13px;color:var(--sub);margin-top:5px;}
  .searchbox{position:relative;margin-bottom:12px;}
  #q{width:100%;padding:14px 16px;border:2px solid var(--navy);border-radius:10px;font-size:17px;font-family:inherit;}
  #q:focus{outline:2px solid var(--accent);outline-offset:1px;}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 4px;}
  .chip{font-size:12px;padding:5px 11px;border-radius:16px;border:1px solid var(--line);background:#fff;
        color:var(--navy);cursor:pointer;font-weight:600;}
  .chip:hover{background:var(--navy-l);}
  .chip.on{background:var(--navy);color:#fff;border-color:var(--navy);}
  .summary{display:flex;gap:16px;flex-wrap:wrap;background:var(--navy-l);border-radius:10px;padding:12px 16px;margin:6px 0 14px;}
  .summary div{font-size:12px;color:var(--sub);}
  .summary b{display:block;font-size:19px;color:var(--navy);font-variant-numeric:tabular-nums;margin-top:2px;}
  .scroll{border:1px solid var(--line);border-radius:10px;overflow:auto;max-height:560px;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th{background:var(--navy);color:#fff;padding:9px 10px;text-align:left;font-size:12px;white-space:nowrap;position:sticky;top:0;z-index:1;}
  td{padding:8px 10px;border-bottom:1px solid var(--line);}
  td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;}
  tr:nth-child(even) td{background:#f8fafc;}
  tr.hi td{background:#fffbe6;}
  .htotal{font-weight:800;color:var(--navy);}
  .fam{display:inline-block;font-size:10.5px;padding:1px 7px;border-radius:9px;background:var(--navy-l);color:var(--navy);font-weight:700;}
  .empty{padding:36px;text-align:center;color:var(--sub);font-size:14px;}
  mark{background:#ffe58a;padding:0 1px;border-radius:2px;}
  footer{font-size:11px;color:var(--sub);margin-top:18px;text-align:center;}
  .hint{font-size:12px;color:var(--sub);margin-top:4px;}
</style>
</head>

<script>
const DATA=JSON.parse(document.getElementById('DATA').textContent);
document.getElementById('tot').textContent=DATA.length.toLocaleString('ko-KR');
const $=id=>document.getElementById(id);
const won=n=>(n==null||n==='')?'':Math.round(n).toLocaleString('ko-KR');
const norm=s=>String(s||'').toUpperCase().replace(/\s/g,'');
const FAMS=['SS','SUS','AL','CR','GI','EGI','PO','SK5'];
let famFilter='';

// 각 레코드 검색용 문자열 미리 계산
DATA.forEach(r=>{ r._s=norm(r.v)+' '+norm(r.m)+' '+norm(r.f)+(r.t!=null?('T'+r.t):''); });

function med(a){ if(!a.length)return null; const s=[...a].sort((x,y)=>x-y); const m=s.length>>1;
  return s.length%2?s[m]:(s[m-1]+s[m])/2; }

function render(){
  const raw=$('q').value.trim();
  const toks=norm(raw).split(/\s+/).filter(Boolean);
  let rows=DATA;
  if(famFilter) rows=rows.filter(r=>r.f===famFilter);
  if(toks.length) rows=rows.filter(r=>toks.every(t=>r._s.includes(t)));
  if(!raw && !famFilter){
    $('body').innerHTML='<tr><td colspan="6" class="empty">검색어를 입력하세요 — 예) “대연 SS 3.2”, “엘파”, “SUS 6T”</td></tr>';
    $('summary').style.display='none'; return;
  }
  if(!rows.length){
    $('body').innerHTML='<tr><td colspan="6" class="empty">해당 조건의 과거 실적이 없습니다</td></tr>';
    $('summary').style.display='none'; return;
  }
  const totals=rows.map(r=>r.h).filter(x=>typeof x==='number');
  $('summary').style.display='flex';
  $('sCnt').textContent=rows.length+'건';
  $('sMed').textContent=won(med(totals))+'원';
  $('sRange').textContent=totals.length?(won(Math.min(...totals))+' ~ '+won(Math.max(...totals))):'–';
  $('sLast').textContent=rows[0].d||'–';
  const re=toks.length?new RegExp('('+toks.map(t=>t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|')+')','gi'):null;
  const hl=s=>{ s=String(s==null?'':s); return re?s.replace(re,'<mark>$1</mark>'):s; };
  $('body').innerHTML=rows.slice(0,400).map(r=>`<tr>
    <td>${r.d||''}</td>
    <td>${hl(r.v)}</td>
    <td>${r.f?`<span class="fam">${r.f}${r.t!=null?' '+r.t+'T':''}</span> `:''}${hl(r.m)}</td>
    <td class="num">${won(r.jc)}</td>
    <td class="num">${won(r.gc)}</td>
    <td class="num htotal">${won(r.h)}</td>
  </tr>`).join('')+(rows.length>400?`<tr><td colspan="6" class="empty">…상위 400건만 표시 (총 ${rows.length}건). 검색어를 좁혀보세요.</td></tr>`:'');
}
// 재질 칩
$('famchips').innerHTML='<span class="chip'+(famFilter===''?' on':'')+'" data-f="">전체</span>'+
  FAMS.map(f=>`<span class="chip" data-f="${f}">${f}</span>`).join('');
$('famchips').addEventListener('click',e=>{
  const c=e.target.closest('.chip'); if(!c)return;
  famFilter=c.dataset.f;
  [...$('famchips').children].forEach(x=>x.classList.toggle('on', x.dataset.f===famFilter));
  render();
});
$('q').addEventListener('input', render);
render();
</script>
